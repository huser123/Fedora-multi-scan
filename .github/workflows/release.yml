name: Portable Fedora release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portable:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf install -y python3 python3-pip binutils curl tar gzip file desktop-file-utils git findutils libX11 libxcb libxkbcommon libxkbcommon-x11 mesa-libEGL mesa-libGL libglvnd-opengl fontconfig dbus-libs sane-backends
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-build.txt
          .venv/bin/python -m pip install -e . --no-deps
          app_version=$(.venv/bin/python -c 'from hpscan import __version__; print(__version__)')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$app_version" ]; then
            echo 'Git tag and application version do not match.' >&2
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen .venv/bin/python -m pytest -q
          bash tools/build-portable.sh
          APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage --smoke-test /tmp/frozen-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: FedoraMultiScan-x86_64
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          body_path: docs/RELEASE-${{ github.ref_name }}.md
          generate_release_notes: true
